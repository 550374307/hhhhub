# Inside the site's server block. Also add the access_by_lua_file directive
# from upgrade-access.lua to its existing location / block.
location @wb2api_upgrade_wait {
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # **覆写而不是追加**。
    #
    # `$proxy_add_x_forwarded_for` 会把客户端自带的 XFF 拼在前面，于是
    # 攻击者只要发一个 `X-Forwarded-For: 1.2.3.4` 就能让应用看到假 IP ——
    # 登录锁、IP 封禁、票据绑定全部失效。用 `$remote_addr` 直接覆盖。
    #
    # 应用侧另有兜底（admin/ratelimit.py 取 XFF 末段 + TRUSTED_PROXY_IPS
    # 信任链），但那是第二道防线，不该替代反代的正确配置。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 660s;
    proxy_next_upstream off;
}
