name: Build Windows desktop

# 触发方式
#   1) 推 tag（v1.0.2 / v1.0.2-fix1 / v1.0.2-fix2 …）→ 构建全部产物 + 发 release
#   2) 手动 workflow_dispatch → 只产出 artifact，不发 release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 默认最小权限；只有负责发 release 的那个 job 才提升到 write。
# pip install / PyInstaller / Gradle 会执行仓库内代码，不该让它们握着可写 token。
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ===================================================================
  # 1) Windows 桌面端
  # ===================================================================
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-desktop-lock.txt

      - name: Verify release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $meta = Get-Content desktop/version.json | ConvertFrom-Json
          $tag = $env:GITHUB_REF_NAME
          # 期望的 tag 就来自 version.json 的 release 字段 —— 它是**唯一真相**。
          # 这样「安装包显示版本」和「release tag」不可能再脱节：
          # 之前 version 固定 1.0.2、fix 号只写在 tag 上，结果装出来的
          # 还是 1.0.2，用户无法区分装没装上新版。
          $expected = "v" + $meta.release
          # ⚠️ 必须用大小写敏感比较（-ceq）。PowerShell 的 -eq 默认忽略大小写，
          # 实测 `V1.0.2` 能通过，会放行大小写写错的 tag。
          if ($tag -cne $expected) {
            throw "Tag '$tag' must equal '$expected' (desktop/version.json release)"
          }
          Write-Host "Tag '$tag' matches desktop/version.json release=$($meta.release)"

      - run: python -m pip install -r requirements-desktop-lock.txt
      - run: python scripts/check_runtime.py

      - name: Build desktop EXE
        run: python scripts/build_desktop.py

      - name: List dist
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: miraihub-windows-x64
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.sha256

  # ===================================================================
  # 2) Android（arm64 APK）
  #
  # 签名身份必须跨版本保持一致，否则新 APK 无法覆盖安装（系统会拒绝
  # 签名不一致的升级）。所以 keystore 从 Secret 注入，而不是让
  # build_android.py 每次现生成 —— 那样每个 release 都是新身份。
  #
  # 需要的 Secret（base64 文本）：
  #   ANDROID_KEYSTORE_B64   release.jks 的 base64
  #   ANDROID_KEYSTORE_PASS  对应密码（同时也是 keyPassword）
  # 未配置时**跳过**而不是失败：fork 的使用者不一定配了签名。
  # ===================================================================
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secret
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "${KS:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_B64 未配置，跳过 APK 构建"
          fi

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        if: steps.signing.outputs.available == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.available == 'true'

      - name: Install Gradle 8.11.1
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Restore signing identity
        if: steps.signing.outputs.available == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          mkdir -p build/android-signing
          printf '%s' "$KS_B64" | base64 -d > build/android-signing/release.jks
          # build_android.py 从 signing.json 读密码；文件权限收紧
          python3 - "$KS_PASS" <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("build/android-signing/signing.json")
          p.write_text(json.dumps({"password": sys.argv[1]}), encoding="utf-8")
          p.chmod(0o600)
          PY
          ls -l build/android-signing

      - name: Build APK
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          python3 scripts/build_android.py \
            --gradle /opt/gradle-8.11.1/bin/gradle \
            --jdk "$JAVA_HOME" \
            --sdk "$ANDROID_HOME"

      - name: List dist
        if: steps.signing.outputs.available == 'true'
        run: ls -la dist/android

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: miraihub-android-arm64
          if-no-files-found: error
          path: |
            dist/android/*.apk
            dist/android/*.sha256

  # ===================================================================
  # 3) Docker 多架构镜像（amd64 + arm64）
  #
  # 用 QEMU + buildx 出真正的多架构 manifest。不推倒 registry 的
  # `latest` 之外还打版本号 tag，方便用户钉版本。
  # 需要 GHCR 的写权限，用内置 GITHUB_TOKEN 即可（同一仓库的 packages）。
  # ===================================================================
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        run: |
          set -euo pipefail
          # 镜像仓库名必须小写
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | cut -d/ -f2)"
          echo "image=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tags=ghcr.io/${owner}/${repo}:${GITHUB_REF_NAME},ghcr.io/${owner}/${repo}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${owner}/${repo}:edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          # 非 tag 触发只构建不推送（验证 Dockerfile 能过）
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image digest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo "### Docker 镜像"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===================================================================
  # 4) 发布 job：唯一持有 contents:write 的地方
  # ===================================================================
  release:
    # `always()` 是必需的：默认语义下，`needs` 里有任何一个 job 被 skipped，
    # 本条也会被跳过 —— 而 Android 在没配签名 Secret 时**自己会跳过**。
    # 那样「没配 Android 签名」就会让整个 release 不发。
    # 是否真的发版由下面第一步根据各 job 的 result 决定。
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: [build, docker, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Report upstream job status
        env:
          BUILD: ${{ needs.build.result }}
          DOCKER: ${{ needs.docker.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          echo "build=$BUILD docker=$DOCKER android=$ANDROID"
          if [ "$BUILD" != "success" ]; then
            echo "::error::Windows 桌面端构建失败，中止发布"
            exit 1
          fi
          if [ "$DOCKER" != "success" ]; then
            echo "::error::Docker 镜像构建失败，中止发布"
            exit 1
          fi
          if [ "$ANDROID" != "success" ]; then
            echo "::warning::Android 未产出（result=$ANDROID），release 将不含 APK"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List dist
        run: ls -la dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="自动构建：${TAG}

          基于上游 MiraiHub 版本，包含本 fork 的小浣熊（raccoon）平台接入。

          - Windows: miraihub-*-windows-x64.exe
          - Docker:  ghcr.io/${GH_REPO,,}:${TAG}（linux/amd64 + linux/arm64）
          - Android: 见附件（未配置签名 Secret 时不含 APK）"
          # 探测同名 release 是否存在。
          # gh 对 404 / 403 / 网络失败一律返回 1，不能只看退出码就断定
          # 「不存在」—— 那会把「没权限」误判成「没有 release」。
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "Release $TAG exists, deleting for rebuild"
            gh release delete "$TAG" --yes --cleanup-tag=false
          else
            echo "No existing release for $TAG; will create"
          fi
          # 只上传实际存在的产物：Android 可能因缺少签名 Secret 而缺席
          shopt -s nullglob
          files=(dist/*.exe dist/*.sha256 dist/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没有可发布的产物"
            exit 1
          fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release create "$TAG" \
            --title "MiraiHub $TAG" \
            --notes "$notes" \
            --verify-tag \
            "${files[@]}"

      - name: Release summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "### Release $TAG published"
            gh release view "$TAG" --json assets --jq '.assets[] | "- \(.name) (\(.size) bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"
